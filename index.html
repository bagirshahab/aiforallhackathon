<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI For All Hackathon - Submit Project</title>
  <link rel="stylesheet" href="submit-project.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="logo">
        <span>AI FOR ALL HACKATHON</span>
      </a>
      
      <!-- Language Selector (English & Thailand Only) -->
      <div class="lang-selector">
        <button id="lang-en" class="lang-btn active" onclick="switchLanguage('en')">EN</button>
        <span class="lang-divider">|</span>
        <button id="lang-th" class="lang-btn" onclick="switchLanguage('th')">TH</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <div class="form-wrapper">
      <div class="form-header">
        <h1 id="title-text">Submit Your Project</h1>
        <p id="subtitle-text">Fill in the form below to register your team and project for the AI For All Hackathon.</p>
      </div>

      <form id="submission-form" novalidate>
        
        <!-- Team Information -->
        <div class="form-section">
          <h2 class="section-title" id="sec-team-title">1. Team Information</h2>
          
          <div class="form-group">
            <label for="teamName" id="lbl-teamName">Team Name *</label>
            <input type="text" id="teamName" name="teamName" required placeholder="e.g. AI Innovators" />
          </div>

          <div class="form-group">
            <label for="leaderName" id="lbl-leaderName">Team Leader Name *</label>
            <input type="text" id="leaderName" name="leaderName" required placeholder="Full Name" />
          </div>

          <div class="form-group">
            <label for="email" id="lbl-email">Leader Email *</label>
            <input type="email" id="email" name="email" required placeholder="leader@example.com" />
          </div>

          <div class="form-group">
            <label for="phone" id="lbl-phone">WhatsApp / Phone Number *</label>
            <input type="tel" id="phone" name="phone" required placeholder="+66 / +62..." />
          </div>
        </div>

        <!-- Project Details -->
        <div class="form-section">
          <h2 class="section-title" id="sec-project-title">2. Project Details</h2>

          <div class="form-group">
            <label for="projectName" id="lbl-projectName">Project Title *</label>
            <input type="text" id="projectName" name="projectName" required placeholder="Project Title" />
          </div>

          <div class="form-group">
            <label for="track" id="lbl-track">Category / Track *</label>
            <select id="track" name="track" required>
              <option value="" disabled selected id="opt-track-default">Select Category</option>
              <option value="Healthcare">Healthcare AI</option>
              <option value="Education">Education & Learning</option>
              <option value="Sustainability">Green & Sustainability</option>
              <option value="Open Innovation">Open Innovation</option>
            </select>
          </div>

          <div class="form-group">
            <label for="description" id="lbl-description">Project Description *</label>
            <textarea id="description" name="description" rows="4" required placeholder="Briefly describe your project, problem solved, and technology used..."></textarea>
          </div>

          <div class="form-group">
            <label for="repoUrl" id="lbl-repoUrl">Repository URL (GitHub / GitLab) *</label>
            <input type="url" id="repoUrl" name="repoUrl" required placeholder="https://github.com/username/project" />
          </div>

          <div class="form-group">
            <label for="demoUrl" id="lbl-demoUrl">Demo / Video Link (Optional)</label>
            <input type="url" id="demoUrl" name="demoUrl" placeholder="https://..." />
          </div>
        </div>

        <!-- Submit Button -->
        <div class="form-actions">
          <button type="submit" id="btn-submit" class="submit-btn">Submit Project</button>
        </div>

      </form>
      
      <div id="response-message" class="response-message hidden"></div>
    </div>
  </main>

  <script src="submit-project.js"></script>
</body>
</html>
