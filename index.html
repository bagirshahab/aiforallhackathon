<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hackathon — Project Submission</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="submit-project.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Navigasi -->
    <nav id="navbar">
        <div class="nav-container">
            <div class="brand">
                <span class="logo-text">AI FOR ALL HACKATHON</span>
            </div>
            <div class="nav-links">
                <a href="submit-project.html" class="active">ส่งผลงาน</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header id="hero" class="page-hero">
        <div class="container hero-content">
            <div class="eyebrow">AI FOR ALL HACKATHON 2026</div>
            <h1>ส่งผลงานโปรเจกต์ AI ของคุณ</h1>
            <p class="subheadline">
                ส่งโปรเจกต์ Gen AI ของทีมคุณที่นี่ โปรดตรวจสอบให้แน่ใจว่าข้อมูลทั้งหมดถูกต้อง
            </p>
        </div>
    </header>

    <!-- Form Section -->
    <section id="form-proyek" class="section-light">
        <div class="container">
            <div class="form-card card">
                <form id="hackathon-form" novalidate>

                    <!-- Team Name -->
                    <div class="form-group">
                        <label for="team_name">ชื่อทีม</label>
                        <input type="text" id="team_name" name="team_name" placeholder="กรอกชื่อทีม" required>
                    </div>

                    <!-- Email Contact -->
                    <div class="form-group">
                        <label for="email">อีเมลติดต่อ (หัวหน้าทีม)</label>
                        <input type="email" id="email" name="email" placeholder="teamleader@example.com" required>
                    </div>

                    <!-- Team Members -->
                    <div class="form-group">
                        <label>สมาชิกในทีม (สูงสุด 5 คน)</label>
                        <div class="members-inputs">
                            <input type="text" name="member_1" placeholder="สมาชิกคนที่ 1 (หัวหน้าทีม)" required>
                            <input type="text" name="member_2" placeholder="สมาชิกคนที่ 2">
                            <input type="text" name="member_3" placeholder="สมาชิกคนที่ 3">
                            <input type="text" name="member_4" placeholder="สมาชิกคนที่ 4">
                            <input type="text" name="member_5" placeholder="สมาชิกคนที่ 5">
                        </div>
                    </div>

                    <!-- Project Title -->
                    <div class="form-group">
                        <label for="project_title">ชื่อโปรเจกต์</label>
                        <input type="text" id="project_title" name="project_title" placeholder="กรอกชื่อโปรเจกต์" required>
                    </div>

                    <!-- Project Theme Dropdown -->
                    <div class="form-group">
                        <label for="project_theme">ธีมหัวข้อโปรเจกต์ (Project Theme)</label>
                        <select id="project_theme" name="project_theme" required class="form-select">
                            <option value="" disabled selected>-- เลือกธีมหัวข้อโปรเจกต์ --</option>
                            <option value="1. Education & Future Skills">1. Education & Future Skills (ยกระดับการศึกษา สร้างทักษะแห่งอนาคต)</option>
                            <option value="2. SME & Local Economy">2. SME & Local Economy (เสริมพลัง SME ขับเคลื่อนเศรษฐกิจท้องถิ่น)</option>
                            <option value="3. Agriculture & Food">3. Agriculture & Food (พลิกโฉมการเกษตร และอาหาร)</option>
                            <option value="4. Health & Aging Society">4. Health & Aging Society (สร้างสุขภาพดี เพื่อชีวิตที่ดีทุกวัย)</option>
                            <option value="5. Smart Mobility & Cities">5. Smart Mobility & Cities (พัฒนาการเดินทาง สร้างเมืองอัจฉริยะ)</option>
                            <option value="6. Resilient Communities">6. Resilient Communities (สร้างชุมชนเข้มแข็งและยั่งยืน)</option>
                        </select>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label for="project_description">คำอธิบายโปรเจกต์ (ไม่เกิน 100 คำ)</label>
                        <textarea id="project_description" name="project_description" rows="4" placeholder="อธิบายแนวทางการแก้ปัญหาด้วย AI ของคุณโดยสังเขป..." required></textarea>
                    </div>

                    <!-- URL / Hosted Project -->
                    <div class="form-group">
                        <label for="html_url">URL ของโปรเจกต์ HTML / เว็บไซต์</label>
                        <input type="url" id="html_url" name="html_url" placeholder="https://your-project.vercel.app หรือ ลิงก์ GitHub">
                    </div>

                    <!-- Upload File -->
                    <div class="form-group">
                        <label for="file_html">หรืออัปโหลดไฟล์ HTML</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="file_html" name="file_html" accept=".html,.htm">
                            <label for="file_html" class="file-input-label">
                                <span id="file-chosen-name">เลือกไฟล์ .html</span>
                            </label>
                        </div>
                    </div>

                    <!-- Checkboxes -->
                    <div class="checkbox-group">
                        <label class="checkbox-container">
                            <input type="checkbox" id="confirm_nationality" name="confirm_nationality" required>
                            <span class="checkmark"></span>
                            <span>เราขอยืนยันว่าสมาชิกทุกคนในทีมมีสัญชาติไทยและมีอายุมากกว่า 18 ปี</span>
                        </label>
                    </div>

                    <div class="checkbox-group">
                        <label class="checkbox-container">
                            <input type="checkbox" id="confirm_truth" name="confirm_truth" required>
                            <span class="checkmark"></span>
                            <span>เราขอยืนยันว่าข้อมูลทั้งหมดที่ระบุเป็นความจริงและถูกต้อง</span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-primary btn-submit" id="submit-btn">
                        <span id="submit-btn-text">ส่งผลงาน</span>
                    </button>

                    <div id="form-message" class="form-message" role="status" aria-live="polite"></div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer-section">
        <div class="container text-center">
            <p class="copyright">© 2026 AI Hackathon Thailand. All rights reserved.</p>
        </div>
    </footer>

    <script src="submit-project.js"></script>
</body>

</html>
