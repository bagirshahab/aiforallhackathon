<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top 5 Teams | AI For All Hackathon</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:'Prompt',system-ui,sans-serif}
  #viewport{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:#000}
  #track{display:flex;height:100%;width:calc(1920px * 6);transition:transform .6s cubic-bezier(.4,0,.2,1)}
  .slide{position:relative;width:1920px;height:1080px;flex:none;background:#000 center/cover no-repeat}
  .slide.orig{background-image:url(kv-original.jpg)}
  .slide.team{background-image:url(kv-clean.jpg)}
  .top5{position:absolute;left:0;right:0;top:442px;text-align:center;font-weight:700;font-size:108px;line-height:1.2;
    background:linear-gradient(90deg,#ff3b3b 0%,#ff9a2e 45%,#3ddc73 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-fill-color:transparent;width:fit-content;margin:0 auto}
  .name{position:absolute;left:50%;top:572px;transform:translateX(-50%);width:1300px;height:110px;display:flex;align-items:center;justify-content:center;
    text-align:center;color:#fff;font-weight:700;font-size:84px;line-height:1.1;white-space:nowrap;text-shadow:0 0 24px rgba(0,0,0,.6)}
  .name:empty::before{content:"\00a0"}
  .nav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:72px;border:0;border-radius:10px;background:rgba(20,20,20,.65);color:#fff;font-size:28px;cursor:pointer;z-index:5;opacity:.55;transition:opacity .2s}
  .nav:hover,.nav:focus-visible{opacity:1}
  .nav[disabled]{opacity:0;pointer-events:none}
  #prev{left:12px}#next{right:12px}
  #dots{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
  #dots button{width:12px;height:12px;border-radius:50%;border:0;background:rgba(255,255,255,.35);cursor:pointer;padding:0}
  #dots button[aria-current="true"]{background:#3ddc73;transform:scale(1.25)}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
  #snd{position:fixed;top:10px;right:12px;z-index:5;width:40px;height:40px;border:0;border-radius:10px;background:rgba(20,20,20,.65);color:#fff;font-size:20px;cursor:pointer;opacity:.55}
  #snd:hover{opacity:1}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="track">
      <section class="slide orig" aria-label="Halaman 1"></section>
      <section class="slide team" aria-label="Halaman 2"><div class="top5">Top 5</div><div class="name" data-rank="1"></div></section>
      <section class="slide team" aria-label="Halaman 3"><div class="top5">Top 5</div><div class="name" data-rank="2"></div></section>
      <section class="slide team" aria-label="Halaman 4"><div class="top5">Top 5</div><div class="name" data-rank="3"></div></section>
      <section class="slide team" aria-label="Halaman 5"><div class="top5">Top 5</div><div class="name" data-rank="4"></div></section>
      <section class="slide team" aria-label="Halaman 6"><div class="top5">Top 5</div><div class="name" data-rank="5"></div></section>
    </div>
  </div>
</div>
<button class="nav" id="prev" aria-label="Sebelumnya">&#10094;</button>
<button class="nav" id="next" aria-label="Berikutnya">&#10095;</button>
<div id="dots"></div>
<canvas id="fx"></canvas>
<button id="snd" aria-label="Suara" title="Suara on/off">&#128266;</button>

<script>
const API = "https://top20scoring.vercel.app/api/public-leaderboard";
const TOTAL = 6;
let idx = Math.min(TOTAL - 1, Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1));

const stage = document.getElementById("stage"), track = document.getElementById("track");
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize", fit); fit();

// ---- Confetti + celebration sound on slide change ----
const fx = document.getElementById("fx"), cx = fx.getContext("2d");
let parts = [], raf = 0;
function sizeFx() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
addEventListener("resize", sizeFx); sizeFx();
const COLORS = ["#ff3b3b", "#ff9a2e", "#ffd93d", "#3ddc73", "#3db8ff", "#b86bff", "#ff6bd6", "#ffffff"];
let emitUntil = 0, emitFrom = 0, fxEnd = 0;
function spawn(side, d, W, H, fast) {
  const spread = 0.35 + Math.random() * 0.95;            // angle above horizontal (rad)
  const a = side === 0 ? -spread : -Math.PI + spread;     // left cannon fires up-right, right cannon up-left
  const sp = (fast ? 46 : 28 + Math.random() * 22) * d;
  parts.push({
    x: side === 0 ? -10 * d : W + 10 * d, y: H * (0.55 + Math.random() * 0.4),
    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    w: (5 + Math.random() * 5) * d, h: (3 + Math.random() * 4) * d,
    r: Math.random() * 6.28, vr: (Math.random() - .5) * .45,
    c: COLORS[(Math.random() * COLORS.length) | 0], life: 0, max: 220 + Math.random() * 120
  });
}
function burst(big) {
  const now = performance.now();
  emitFrom = now; emitUntil = now + (big ? 1300 : 800); fxEnd = now + (big ? 4200 : 3200);
  const W = fx.width, H = fx.height, d = devicePixelRatio;
  for (let i = 0; i < (big ? 160 : 90); i++) { spawn(0, d, W, H, true); spawn(1, d, W, H, true); } // opening blast
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  const W = fx.width, H = fx.height, d = devicePixelRatio, now = performance.now();
  if (now < emitUntil) {                                   // continuous streams from both sides
    const k = 1 - (now - emitFrom) / (emitUntil - emitFrom);
    const n = Math.ceil(9 * k + 2);
    for (let i = 0; i < n; i++) { spawn(0, d, W, H, false); spawn(1, d, W, H, false); }
  }
  cx.clearRect(0, 0, W, H);
  if (now >= fxEnd) parts = [];
  const fade = Math.min(1, (fxEnd - now) / 700);
  const g = .42 * d;
  parts = parts.filter(p => p.life < p.max && p.y < H + 60 * d);
  for (const p of parts) {
    p.life++; p.vy += g; p.vx *= .975; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.globalAlpha = Math.max(0, Math.min(1, (p.max - p.life) / 30, fade));
    cx.fillStyle = p.c; cx.scale(1, Math.abs(Math.cos(p.r * 2)) * .8 + .2);
    cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
  }
  raf = (parts.length && now < fxEnd) ? requestAnimationFrame(tick) : 0;
  if (!raf) cx.clearRect(0, 0, W, H);
}let ac = null, muted = localStorage.getItem("top5mute") === "1";
const sndBtn = document.getElementById("snd");
sndBtn.textContent = muted ? "\u{1F507}" : "\u{1F50A}";
sndBtn.onclick = () => { muted = !muted; localStorage.setItem("top5mute", muted ? "1" : "0"); sndBtn.textContent = muted ? "\u{1F507}" : "\u{1F50A}"; if (muted) stopLoop(); else if (idx < TOTAL - 1) startLoop(); };
function tone(f, t0, dur, type, vol, dest) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + .02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest); o.start(t0); o.stop(t0 + dur + .05);
}
let lastOut = null;
function noiseBuf(sec) {
  const n = (ac.sampleRate * sec) | 0, b = ac.createBuffer(1, n, ac.sampleRate), c = b.getChannelData(0);
  for (let i = 0; i < n; i++) c[i] = Math.random() * 2 - 1;
  return b;
}
function brass(f, t0, dur, vol, dest) {
  const g = ac.createGain(), lp = ac.createBiquadFilter();
  lp.type = "lowpass"; lp.Q.value = 2;
  lp.frequency.setValueAtTime(500, t0); lp.frequency.exponentialRampToValueAtTime(3200, t0 + .08);
  lp.frequency.exponentialRampToValueAtTime(1800, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .03);
  g.gain.setValueAtTime(vol, t0 + Math.max(.05, dur - .08)); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  lp.connect(g); g.connect(dest);
  [-6, 6].forEach(det => { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.detune.value = det; o.connect(lp); o.start(t0); o.stop(t0 + dur + .05); });
}
function hit(t, f0, f1, dur, vol, dest) {            // drum body
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .02);
}
function snare(t, vol, dest, len) {
  const n = ac.createBufferSource(); n.buffer = noiseBuf(len || .18);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 3000; bp.Q.value = .8;
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + (len || .18));
  n.connect(bp); bp.connect(g); g.connect(dest); n.start(t);
  hit(t, 220, 160, .08, vol * .5, dest);
}
function cymbal(t, vol, dest, len) {
  const n = ac.createBufferSource(); n.buffer = noiseBuf(len);
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 5500;
  const g = ac.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + len);
  n.connect(hp); hp.connect(g); g.connect(dest); n.start(t);
}
function strings(f, t, dur, vol, dest) {             // soft sustained pad
  const g = ac.createGain(), lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2200;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .15);
  g.gain.setValueAtTime(vol, t + dur - .3); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  lp.connect(g); g.connect(dest);
  [-8, 0, 8].forEach(dt => { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.detune.value = dt; o.connect(lp); o.start(t); o.stop(t + dur + .05); });
}
const N = { C2: 65.41, F2: 87.31, G2: 98, A2: 110, C3: 130.81, E3: 164.81, F3: 174.61, G3: 196, A3: 220, B3: 246.94,
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392, A4: 440, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880, C6: 1046.5 };
// Award-show winner theme (original), ~6 s, 128 bpm.
function playSound() {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    if (lastOut) { lastOut.gain.cancelScheduledValues(ac.currentTime); lastOut.gain.setTargetAtTime(0, ac.currentTime, .05); }
    const out = ac.createGain(); out.gain.value = .75; lastOut = out;
    const comp = ac.createDynamicsCompressor(); out.connect(comp); comp.connect(ac.destination);
    const t = ac.currentTime + .03, q = 60 / 128, e = q / 2;
    // opening stab
    cymbal(t, .5, out, 1.8); hit(t, 110, 40, .5, .9, out);
    ["C4", "E4", "G4", "C5"].forEach(n => brass(N[n], t, q * 1.5, .14, out));
    // melody: [note, start in eighths, length in eighths]
    const mel = [["G4",3,1],["C5",4,1],["E5",5,1],["G5",6,2],["E5",8,1],["G5",9,3],
                 ["A5",12,1],["G5",13,1],["F5",14,1],["E5",15,1],["D5",16,2],["G5",18,2],
                 ["C6",20,8]];
    mel.forEach(([n, s, l]) => { brass(N[n], t + s * e, l * e - .02, .22, out); brass(N[n] / 2, t + s * e, l * e - .02, .1, out); });
    // harmony pads per bar
    [[4, 8, ["C4","E4","G4"]], [12, 4, ["F4","A4","C5"]], [16, 4, ["G3","B3","D4"]], [20, 9, ["C4","E4","G4","C5"]]]
      .forEach(([s, l, ch]) => ch.forEach(n => strings(N[n], t + s * e, l * e, .05, out)));
    // bass on each beat
    [["C2",4],["C2",6],["C2",8],["C2",10],["F2",12],["F2",14],["G2",16],["G2",18],["C2",20]]
      .forEach(([n, s]) => brass(N[n], t + s * e, s === 20 ? 8 * e : 1.6 * e, .16, out));
    // march drums
    for (let s = 4; s < 20; s++) snare(t + s * e, s % 4 === 0 ? .35 : .18, out);
    for (let s = 4; s < 20; s += 2) hit(t + s * e, 100, 45, .25, .6, out);
    for (let i = 0; i < 6; i++) snare(t + 19 * e + i * e / 6, .15 + i * .04, out, .06); // fill
    // final hit
    const tf = t + 20 * e;
    cymbal(tf, .55, out, 3); hit(tf, 120, 35, .7, 1, out);
    // crowd cheer + applause under the ending
    const cr = ac.createBufferSource(); cr.buffer = noiseBuf(5);
    const f1 = ac.createBiquadFilter(); f1.type = "bandpass"; f1.frequency.value = 1200; f1.Q.value = .6;
    const env = ac.createGain();
    env.gain.setValueAtTime(.0001, t); env.gain.exponentialRampToValueAtTime(.18, t + .4); env.gain.setValueAtTime(.18, tf + .5); env.gain.exponentialRampToValueAtTime(.0001, tf + 3);
    cr.connect(f1); f1.connect(env); env.connect(out); cr.start(t);
  } catch (e) {}
}
// ---- Drum roll loop while waiting for the next winner ----
let loopMaster = null, loopTimer = 0, loopOn = false, nextHit = 0, rollStart = 0;
const ROLL = 4;                                       // seconds per crescendo cycle
function startLoop() {
  if (muted || loopOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    loopOn = true;
    loopMaster = ac.createGain(); loopMaster.gain.value = .0001;
    const comp = ac.createDynamicsCompressor(); loopMaster.connect(comp); comp.connect(ac.destination);
    nextHit = rollStart = ac.currentTime + .1;
    loopTimer = setInterval(scheduleLoop, 80);
    loopMaster.gain.setTargetAtTime(.6, ac.currentTime, .6);
  } catch (e) { loopOn = false; }
}
function scheduleLoop() {
  if (!ac || !loopOn) return;
  while (nextHit < ac.currentTime + .25) {
    const ph = ((nextHit - rollStart) % ROLL) / ROLL;  // 0..1 within a cycle
    snare(nextHit, .06 + ph * .22, loopMaster, .05);
    const k = Math.round((nextHit - rollStart) / .048);
    if (k % 5 === 0) hit(nextHit, 90, 70, .2, .12 + ph * .35, loopMaster); // timpani rumble
    if (ph < .012) hit(nextHit, 70, 40, .4, .5, loopMaster);               // cycle downbeat
    nextHit += .048;
  }
}
function loopLevel(v, tc) { if (loopMaster) loopMaster.gain.setTargetAtTime(Math.max(v, .0001), ac.currentTime, tc); }
let resumeTimer = 0;
function duckLoop() {
  loopLevel(0, .03); clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => { if (!muted && idx < TOTAL - 1) { rollStart = ac.currentTime; loopLevel(.5, 1); } }, 6500);
}
function stopLoop() {
  loopOn = false; clearInterval(loopTimer); clearTimeout(resumeTimer);
  if (loopMaster) { loopLevel(0, .05); const m = loopMaster; loopMaster = null; setTimeout(() => m.disconnect(), 600); }
}
["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, () => { if (!loopOn && idx < TOTAL - 1) startLoop(); }, { passive: true }));function celebrate(big) { burst(big); duckLoop(); playSound(); }const dots = document.getElementById("dots");
for (let i = 0; i < TOTAL; i++) {
  const b = document.createElement("button");
  b.setAttribute("aria-label", "Ke halaman " + (i + 1));
  b.onclick = () => go(i);
  dots.appendChild(b);
}
function go(i, quiet) {
  const prev = idx;
  idx = Math.max(0, Math.min(TOTAL - 1, i));
  if (!quiet && idx !== prev) { if (idx > 0) celebrate(true); else { burst(false); if (loopOn) loopLevel(.55, .5); } }
  track.style.transform = `translateX(${-idx * 1920}px)`;
  [...dots.children].forEach((d, k) => d.setAttribute("aria-current", k === idx));
  document.getElementById("prev").disabled = idx === 0;
  document.getElementById("next").disabled = idx === TOTAL - 1;
  history.replaceState(null, "", "#" + (idx + 1));
}
document.getElementById("prev").onclick = () => go(idx - 1);
document.getElementById("next").onclick = () => go(idx + 1);
addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(idx + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(idx - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(TOTAL - 1);
});
let sx = null;
addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1));
});
go(idx, true);

// Shrink long names so they stay on one line.
function setName(el, text) {
  el.textContent = "";
  if (!text) return;
  const span = document.createElement("span");
  span.textContent = text;
  el.appendChild(span);
  let size = 84; el.style.fontSize = size + "px";
  while (span.offsetWidth > el.clientWidth && size > 28) { size -= 2; el.style.fontSize = size + "px"; }
}

async function load() {
  let names = [];
  try {
    const res = await fetch(API, { cache: "no-store" });
    const data = await res.json();
    if (res.ok && data.published !== false) {
      names = (data.ranking || [])
        .filter(r => Number(r.judge_count) > 0)
        .slice(0, 5)
        .map(r => (r.team_name || r.project_title || "").trim());
    }
  } catch (e) { return; } // keep the current names if the request fails
  document.querySelectorAll(".name").forEach(el => {
    const n = names[Number(el.dataset.rank) - 1] || "";
    if (el.dataset.v !== n) { el.dataset.v = n; setName(el, n); }
  });
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
