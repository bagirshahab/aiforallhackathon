<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch Order | AI For All Hackathon</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:'Prompt',system-ui,sans-serif}
  #viewport{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:#000}
  #track{display:flex;height:100%;width:calc(1920px * 19);transition:transform .6s cubic-bezier(.4,0,.2,1)}
  .slide{position:relative;width:1920px;height:1080px;flex:none;background:radial-gradient(ellipse at 50% 50%,#0b2a1c 0%,#04100b 55%,#000 100%)}
  .grad{background:linear-gradient(90deg,#ff3b3b 0%,#ff9a2e 45%,#3ddc73 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  .title{position:absolute;left:0;right:0;top:60px;text-align:center;font-weight:800;font-size:96px;line-height:1.2;white-space:nowrap;color:#fff}
  .title .grad{display:inline-block}
  .num{position:absolute;left:0;right:0;top:190px;text-align:center;font-weight:800;font-size:380px;line-height:1.1;width:fit-content;margin:0 auto}
  .name{position:absolute;left:50%;top:660px;transform:translateX(-50%);width:1800px;height:340px;display:flex;align-items:center;justify-content:center;
    text-align:center;color:#fff;font-weight:700;font-size:170px;line-height:1.2}
  .nav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:72px;border:0;border-radius:10px;background:rgba(20,20,20,.65);color:#fff;font-size:28px;cursor:pointer;z-index:5;opacity:.55;transition:opacity .2s}
  .nav:hover,.nav:focus-visible{opacity:1}
  .nav[disabled]{opacity:0;pointer-events:none}
  #prev{left:12px}#next{right:12px}
  #dots{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
  #dots button{width:11px;height:11px;border-radius:50%;border:0;background:rgba(255,255,255,.35);cursor:pointer;padding:0}
  #dots button[aria-current="true"]{background:#3ddc73;transform:scale(1.25)}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage"><div id="track"></div></div>
</div>
<button class="nav" id="prev" aria-label="Previous">&#10094;</button>
<button class="nav" id="next" aria-label="Next">&#10095;</button>
<div id="dots"></div>
<script>
const TEAMS = [
  "TwinPlusTwo","JT","spkls","เข็มทิศอาชีพ","Jaaviz","SixSeven","RSI","Rohaso","Tuppy Lucky",
  "404 Brain Not Found","Belka+","ลูกเซบาสเตียน","Vcare","Areazero","PENTAGON","Overload","StealAnEgg",
  "นั่งกินหมูน้ำตกบนเถียงนาปรังที่อุสเบกิสถาน","สาดไปสมาชิก"
];
const TOTAL = TEAMS.length;
let idx = Math.min(TOTAL - 1, Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1));
const stage = document.getElementById("stage"), track = document.getElementById("track"), dots = document.getElementById("dots");
function fit() {
  stage.style.transform = `translate(-50%,-50%) scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`;
}
addEventListener("resize", fit); fit();
TEAMS.forEach((t, i) => {
  const s = document.createElement("section");
  s.className = "slide";
  s.setAttribute("aria-label", "Pitch " + (i + 1));
  s.innerHTML = '<div class="title"><span class="grad">AI</span> FOR ALL <span class="grad">HACKATHON</span></div><div class="num grad"></div><div class="name"><span></span></div>';
  s.querySelector(".num").textContent = i + 1;
  s.querySelector(".name span").textContent = t;
  track.appendChild(s);
  const b = document.createElement("button");
  b.setAttribute("aria-label", "Go to " + (i + 1));
  b.onclick = () => go(i);
  dots.appendChild(b);
});
function go(i) {
  idx = Math.max(0, Math.min(TOTAL - 1, i));
  track.style.transform = `translateX(${-idx * 1920}px)`;
  [...dots.children].forEach((d, k) => d.setAttribute("aria-current", k === idx));
  document.getElementById("prev").disabled = idx === 0;
  document.getElementById("next").disabled = idx === TOTAL - 1;
  history.replaceState(null, "", "#" + (idx + 1));
}
document.getElementById("prev").onclick = () => go(idx - 1);
document.getElementById("next").onclick = () => go(idx + 1);
addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(idx + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(idx - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(TOTAL - 1);
  else if (e.key === "f" || e.key === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
let sx = null;
addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1));
});
// Largest size that fits the name box (up to 2 lines).
function shrink() {
  document.querySelectorAll(".name").forEach(el => {
    const span = el.firstChild; let size = 170; el.style.fontSize = size + "px";
    while ((span.offsetHeight > el.clientHeight || span.scrollWidth > el.clientWidth) && size > 40) { size -= 4; el.style.fontSize = size + "px"; }
  });
}
go(idx);
shrink();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(shrink);
</script>
</body>
</html>
