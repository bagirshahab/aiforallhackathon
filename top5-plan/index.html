<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top 5 Plan to the Final Day | AI For All Hackathon</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden}
  #track{display:flex;width:300vw;height:100vh;transition:transform .55s cubic-bezier(.4,0,.2,1)}
  iframe{flex:none;width:100vw;height:100vh;border:0;background:#000;pointer-events:none}
  .nav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:72px;border:0;border-radius:10px;background:rgba(20,20,20,.65);color:#fff;font-size:28px;cursor:pointer;z-index:5;opacity:.5;transition:opacity .2s}
  .nav:hover,.nav:focus-visible{opacity:1}
  .nav[disabled]{opacity:0;pointer-events:none}
  #prev{left:12px}#next{right:12px}
  #dots{position:fixed;bottom:12px;left:24px;display:flex;gap:10px;z-index:5}
  #dots button{width:12px;height:12px;border-radius:50%;border:0;background:rgba(255,255,255,.35);cursor:pointer;padding:0}
  #dots button[aria-current="true"]{background:#3ddc73;transform:scale(1.25)}
</style>
</head>
<body>
<div id="track">
  <iframe src="calendar.html" title="Calendar" loading="eager"></iframe>
  <iframe src="timeline.html" title="Timeline" loading="eager"></iframe>
  <iframe src="detail.html" title="Detail" loading="eager"></iframe>
</div>
<button class="nav" id="prev" aria-label="Previous">&#10094;</button>
<button class="nav" id="next" aria-label="Next">&#10095;</button>
<div id="dots"></div>
<script>
const TOTAL=3, track=document.getElementById("track"), dots=document.getElementById("dots");
let idx=Math.min(TOTAL-1,Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
for(let i=0;i<TOTAL;i++){const b=document.createElement("button");b.setAttribute("aria-label","Slide "+(i+1));b.onclick=()=>go(i);dots.appendChild(b)}
function go(i){
  idx=Math.max(0,Math.min(TOTAL-1,i));
  track.style.transform=`translateX(${-idx*100}vw)`;
  [...dots.children].forEach((d,k)=>d.setAttribute("aria-current",k===idx));
  prev.disabled=idx===0; next.disabled=idx===TOTAL-1;
  history.replaceState(null,"","#"+(idx+1));
}
prev.onclick=()=>go(idx-1); next.onclick=()=>go(idx+1);
addEventListener("keydown",e=>{
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(idx+1)}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(idx-1)}
  else if(e.key==="Home")go(0); else if(e.key==="End")go(TOTAL-1);
  else if(e.key==="f"||e.key==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
let sx=null;
addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)go(idx+(dx<0?1:-1))});
go(idx);
</script>
</body>
</html>
